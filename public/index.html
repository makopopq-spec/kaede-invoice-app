<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>楓Care taxi 請求書・見積書・領収書作成</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Yu Gothic", sans-serif; margin: 0; padding: 16px 16px 80px; background: #f6f6f4; color: #222; }
  h1 { font-size: 18px; margin: 4px 0 16px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; background: #fff; }
  legend { font-size: 13px; color: #666; padding: 0 4px; }
  label { display: block; font-size: 13px; color: #444; margin: 8px 0 4px; }
  input[type=text], input[type=date], input[type=time], input[type=number], textarea {
    width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;
  }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle label { flex: 1; text-align: center; border: 1px solid #ccc; border-radius: 6px; padding: 10px; margin: 0; background: #fafafa; }
  .type-toggle input { display: none; }
  .type-toggle input:checked + span { font-weight: bold; }
  .type-toggle label:has(input:checked) { background: #ffe9c7; border-color: #d98c1f; }
  .item-row { border: 1px dashed #ccc; border-radius: 8px; padding: 10px; margin-bottom: 10px; position: relative; }
  .item-row .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .remove-row { position: absolute; top: 6px; right: 6px; background: #d9534f; color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 14px; }
  .add-row, .submit-btn { padding: 12px; font-size: 15px; border-radius: 8px; border: none; }
  .add-row { background: #eee; color: #333; }
  .submit-btn { background: #d98c1f; color: #fff; font-weight: bold; }
  .hint { font-size: 11px; color: #888; margin-top: 2px; }
  #status { font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
  .total-bar {
    position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1px solid #d98c1f; border-radius: 8px; padding: 10px 14px; margin: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .total-bar .label { font-size: 13px; color: #666; }
  .total-bar .amount { font-size: 22px; font-weight: bold; color: #d98c1f; }
</style>
</head>
<body>
  <h1>楓Care taxi 請求書・見積書・領収書作成</h1>
  <form id="invoice-form">
    <fieldset>
      <legend>種類</legend>
      <div class="type-toggle">
        <label><input type="radio" name="type" value="invoice" checked><span>請求書</span></label>
        <label><input type="radio" name="type" value="quote"><span>見積書</span></label>
        <label><input type="radio" name="type" value="receipt"><span>領収書</span></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>宛先</legend>
      <label>お客様名(様は自動で付きます)</label>
      <input type="text" name="customerName" required placeholder="例: タカハシ マサコ">
      <label>ご住所(任意)</label>
      <input type="text" name="customerAddress" placeholder="任意">
    </fieldset>

    <fieldset>
      <legend>日付</legend>
      <label>発行日</label>
      <input type="date" name="issueDate" id="issueDate" required>
      <div id="dueDateGroup">
        <label id="dueDateLabel">お支払期限(任意)</label>
        <input type="date" name="dueDate" id="dueDate">
      </div>
    </fieldset>

    <fieldset id="descriptionGroup" style="display:none;">
      <legend>但し書き</legend>
      <label>領収の内容</label>
      <input type="text" name="description" id="description" placeholder="介護タクシー利用料として">
    </fieldset>

    <fieldset>
      <legend>明細</legend>
      <div id="items"></div>
      <button type="button" class="add-row" id="add-row">＋ 明細を追加</button>
    </fieldset>

    <fieldset>
      <legend>備考(任意)</legend>
      <textarea name="note" rows="3" placeholder="任意"></textarea>
    </fieldset>

    <div class="total-bar">
      <span class="label">合計金額(税込)</span>
      <span class="amount" id="liveTotal">¥0</span>
    </div>

    <button type="submit" class="submit-btn">作成してDriveに保存</button>
    <div id="status"></div>
  </form>

  <template id="item-template">
    <div class="item-row">
      <button type="button" class="remove-row">×</button>
      <label>ご利用日</label>
      <input type="date" name="items[__IDX__][visitDate]">
      <div class="grid2">
        <div><label>開始時刻(任意)</label><input type="time" name="items[__IDX__][startTime]"></div>
        <div><label>終了時刻(任意)</label><input type="time" name="items[__IDX__][endTime]"></div>
      </div>
      <label>詳細</label>
      <input type="text" name="items[__IDX__][detail]" placeholder="例: 自宅→〇〇病院 通院送迎">
      <div class="grid2">
        <div><label>運賃</label><input type="number" name="items[__IDX__][fare]" inputmode="numeric"></div>
        <div><label>機材料</label><input type="number" name="items[__IDX__][equipment]" inputmode="numeric"></div>
        <div><label>介助料</label><input type="number" name="items[__IDX__][care]" inputmode="numeric"></div>
        <div><label>ETC料金</label><input type="number" name="items[__IDX__][etc]" inputmode="numeric"></div>
      </div>
      <label>割引額(あれば)</label>
      <input type="number" name="items[__IDX__][discount]" inputmode="numeric">
    </div>
  </template>

  <script>
    const itemsContainer = document.getElementById("items");
    const template = document.getElementById("item-template");
    let idx = 0;

    const today = new Date().toISOString().slice(0, 10);

    const liveTotalEl = document.getElementById("liveTotal");
    function updateLiveTotal() {
      let total = 0;
      itemsContainer.querySelectorAll(".item-row").forEach((row) => {
        const num = (name) => Number(row.querySelector(`input[name$="[${name}]"]`)?.value) || 0;
        total += num("fare") + num("equipment") + num("care") + num("etc") - num("discount");
      });
      liveTotalEl.textContent = "¥" + total.toLocaleString("ja-JP");
    }

    function addRow() {
      const html = template.innerHTML.replaceAll("__IDX__", String(idx));
      const wrapper = document.createElement("div");
      wrapper.innerHTML = html;
      const row = wrapper.firstElementChild;
      row.querySelector(".remove-row").addEventListener("click", () => {
        if (itemsContainer.children.length > 1) row.remove();
        updateLiveTotal();
      });
      row.querySelector('input[type="date"]').value = today;
      row.querySelectorAll('input[type="number"]').forEach((input) => {
        input.addEventListener("input", updateLiveTotal);
      });
      itemsContainer.appendChild(row);
      idx++;
    }

    document.getElementById("add-row").addEventListener("click", () => {
      addRow();
      updateLiveTotal();
    });
    addRow();

    document.getElementById("issueDate").value = today;

    const typeRadios = document.querySelectorAll('input[name="type"]');
    const dueDateLabel = document.getElementById("dueDateLabel");
    const dueDateGroup = document.getElementById("dueDateGroup");
    const descriptionGroup = document.getElementById("descriptionGroup");
    function syncLabel() {
      const type = document.querySelector('input[name="type"]:checked').value;
      dueDateGroup.style.display = type === "receipt" ? "none" : "";
      dueDateLabel.textContent = type === "invoice" ? "お支払期限(任意)" : "見積有効期限(任意)";
      descriptionGroup.style.display = type === "receipt" ? "" : "none";
    }
    typeRadios.forEach((r) => r.addEventListener("change", syncLabel));
    syncLabel();

    document.getElementById("invoice-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById("status");
      statusEl.textContent = "作成中です...(最大1分ほどかかる場合があります)";
      const formData = new FormData(e.target);
      const params = new URLSearchParams();
      for (const [k, v] of formData.entries()) params.append(k, v);

      try {
        const res = await fetch("/generate", { method: "POST", body: params });
        const data = await res.json();
        if (!data.ok) {
          statusEl.textContent = "エラー: " + data.error;
          return;
        }
        statusEl.innerHTML =
          `作成しました(書類番号: ${data.docNumber})<br>` +
          `<a href="${data.pdfUrl}" target="_blank">PDFを開く/ダウンロード</a><br>` +
          `<a href="${data.driveLink}" target="_blank">Googleドライブで見る</a>`;
      } catch (err) {
        statusEl.textContent = "通信エラーが発生しました: " + err.message;
      }
    });
  </script>
</body>
</html>
